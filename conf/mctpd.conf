# Role: either bus-owner or endpoint or unknown
role = "bus-owner"

# MCTP protocol configuration. Used for both endpoint and bus-owner modes.
[mctp]
message_timeout_ms = 30

# Specify a UUID: not generally required - mctpd will query the system UUID
# where available.
# uuid = "21f0f554-7f7c-4211-9ca1-6d0f000ea9e7"

# bus-owner configuration
[bus-owner]

# dynamic EID range: a 2-element array of min and max (inclusive) EID values.
dynamic_eid_range = [8, 254]

max_pool_size = 15

# Bus Owner/bridge polling interval (ms) to check endpoint accessibility.
# A value of 0 disables polling.
endpoint_poll_ms = 0

# Autonomous periodic discovery for point-to-point addressless interfaces (e.g. Serial, USB, KCS)
# Default is false.
auto_discovery = false

# Periodic probing interval (ms) for point-to-point interfaces (100 - 60000 ms)
probe_interval_ms = 1000

# Interface specific configuration examples:
#
# [[interface]]
# match = { phys-type = "serial" }
# role = "bus-owner"
# auto_discovery = true
# probe_interval_ms = 500
# static_eid = 8
#
# [[interface]]
# match = { phys-type = "usb" }
# role = "bus-owner"
# auto_discovery = true
# probe_interval_ms = 500
# static_eid = 9

